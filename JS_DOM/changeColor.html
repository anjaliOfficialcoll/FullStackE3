<div id="box">

</div>

<button onclick="changeColor()">Change color</button>
<style>
    div{
        height: 100px;
        width:100px;
        background-color: red;
    }
    
</style>
<script>
    var box=document.getElementById("box");
    function changeColor(){
        box.style.backgroundColor="blue";
        box.style.width="200px";
        
    }
</script>
